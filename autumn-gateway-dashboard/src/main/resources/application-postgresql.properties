# PostgreSQL 数据源（激活方式：--spring.profiles.active=postgresql）
# 注意：url / 账号密码请按实际环境修改；schema 使用 schema-postgresql.sql（与 MySQL 语义一致，DDL 语法适配 PG）。
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://192.168.0.102:5432/autumn-security?serverTimezone=Asia/Shanghai
spring.datasource.username=admin
spring.datasource.password=123456
# 旧表结构 + basic_* 新表结构（均使用 CREATE TABLE IF NOT EXISTS，可重复执行）
spring.sql.init.schema-locations=classpath:schema-postgresql.sql,classpath:schema-basic-postgresql.sql
# 种子数据（默认租户、admin 登录账号、basic_* 演示数据）由 NamespaceDataInitializer 统一幂等播种
