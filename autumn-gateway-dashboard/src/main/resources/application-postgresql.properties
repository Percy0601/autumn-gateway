# PostgreSQL 数据源（激活方式：--spring.profiles.active=postgresql）
# 注意：url / 账号密码请按实际环境修改；schema 使用 schema-postgresql.sql（与 MySQL 语义一致，DDL 语法适配 PG）。
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/autumn-security?serverTimezone=Asia/Shanghai
spring.datasource.username=admin
spring.datasource.password=123456
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
