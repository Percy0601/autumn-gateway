# H2 数据源（激活方式：--spring.profiles.active=h2database）
#
# 连接的是本地独立启动的 H2 TCP 服务：
#   启动：D:\opt\h2\start-h2-server.bat
#   停止：D:\opt\h2\stop-h2-server.bat
#   端口：9092    数据目录：D:\opt\h2\data
#   服务启动命令：java -cp h2-2.5.252.jar org.h2.tools.Server -tcp -tcpPort 9092
#                      -tcpAllowOthers -ifNotExists -baseDir D:\opt\h2\data
#
# 关于「MySQL 协议」：H2 只提供三种服务端协议 —— TCP（H2 原生）/ PG（PostgreSQL 线协议）/
# Web（HTTP 控制台），官方并不实现 MySQL 线协议。因此这里走 H2 原生 TCP，并打开
# MODE=MySQL 做 SQL 方言兼容，反引号标识符、AUTO_INCREMENT、DATETIME ... ON UPDATE
# CURRENT_TIMESTAMP、列级 COMMENT 等 MySQL 写法均照常可用。
# 连接串中的 MODE / DATABASE_TO_LOWER / CASE_INSENSITIVE_IDENTIFIERS 属于建库时设置，
# 已持久化到数据库文件，后续连接务必保持一致，否则 H2 会拒绝打开。
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:tcp://localhost:9092/autumn_security;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=123456
# H2 专用建表脚本（由 schema-mysql.sql + schema-basic-mysql.sql 适配而来）
# 注意：H2 的索引名是 SCHEMA 级全局唯一，而 MySQL 仅表内唯一，原脚本中 idx_status /
# idx_user / uk_appid 在多张表重名会直接报 "Index ... already exists"，故 H2 版本
# 已将这些索引名加上表名前缀，详见 schema-h2database.sql 文件头注释。
spring.sql.init.schema-locations=classpath:schema-h2database.sql,classpath:db/gateway/gw_schema_h2.sql
