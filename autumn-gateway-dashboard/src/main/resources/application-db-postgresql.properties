# db-postgresql：PostgreSQL 数据源（激活方式：--spring.profiles.active=db-postgresql）
# schema 使用 schema-postgresql.sql 系列（与 MySQL 语义一致，DDL 语法适配 PG）。
#
# 连接串 / 账号 / 口令只从环境变量注入，无默认值，参考仓库根目录 .env.example。
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# 旧表结构 + basic_* 新表结构（均使用 CREATE TABLE IF NOT EXISTS，可重复执行）
spring.sql.init.schema-locations=classpath:schema-postgresql.sql,classpath:schema-basic-postgresql.sql,classpath:db/gateway/gw_schema_postgresql.sql
# 种子数据（默认租户、admin 登录账号、basic_* 演示数据）由 NamespaceDataInitializer 统一幂等播种
