# MySQL 数据源（默认 profile）
# 开启 ANSI_QUOTES：使 SQL 中的双引号被当作标识符引用（如 "user" 表），
# 从而让同一份 @Query 在 MySQL 与 PostgreSQL 下都能正确解析保留字 user。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.0.115:3306/autumn-security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true&sessionVariables=sql_mode='ANSI_QUOTES'
spring.datasource.username=admin
spring.datasource.password=123456
# 旧表结构 + basic_* 新表结构（均使用 CREATE TABLE IF NOT EXISTS，可重复执行）
spring.sql.init.schema-locations=classpath:schema-mysql.sql,classpath:schema-basic-mysql.sql
