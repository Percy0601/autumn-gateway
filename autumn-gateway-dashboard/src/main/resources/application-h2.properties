# ============================================================
# H2 内存库 profile（仅本地开发 / 沙箱验证用，不承担生产数据）
# 激活方式：SPRING_PROFILES_ACTIVE=h2 或 --spring.profiles.active=h2
# 默认 mysql / postgresql profile 不受影响。
# ============================================================

spring.datasource.driver-class-name=org.h2.Driver
# 内存库；MODE=MySQL 兼容 MySQL 语法；
# CASE_INSENSITIVE_IDENTIFIERS=TRUE 让引号标识符大小写不敏感，
# 使 Spring Data JDBC 生成的 "ID"/"NAME" 等大写列名能匹配 schema 里的 id/name，
# 与 MySQL 列名大小写不敏感的行为保持一致（否则 basic_* 派生查询报 Column not found）。
spring.datasource.url=jdbc:h2:mem:autumn;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# 启动时建表（schema-h2.sql / schema-basic-h2.sql）
# 种子数据（默认租户、admin 登录账号、basic_* 演示数据）由 NamespaceDataInitializer 统一幂等播种
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql,classpath:schema-basic-h2.sql

# 可选：H2 控制台（调试用，/h2-console）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
