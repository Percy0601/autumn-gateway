# ============================================================
# H2 内存库 profile（仅本地开发 / 沙箱验证用，不承担生产数据）
# 激活方式：SPRING_PROFILES_ACTIVE=h2 或 --spring.profiles.active=h2
# 默认 mysql / postgresql profile 不受影响。
# ============================================================

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:autumn;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# 启动时建表 + 灌入演示数据（schema-h2.sql / schema-basic-h2.sql / data-h2.sql）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql,classpath:schema-basic-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql

# 可选：H2 控制台（调试用，/h2-console）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
