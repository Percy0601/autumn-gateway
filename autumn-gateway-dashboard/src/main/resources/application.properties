spring.application.name=autumn-gateway
server.port=8080

# ===== 数据源与表初始化按 profile 切换（mysql / postgresql）=====
# 默认使用 MySQL；切到 PostgreSQL 启动参数加 --spring.profiles.active=postgresql
spring.profiles.active=mysql
spring.sql.init.mode=always

# Hikari 连接池调优
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=5000

# Jackson 日期格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# JWT 配置
jwt.secret=autumn-gateway-secret-key-must-be-at-least-256-bits-long
jwt.expiration-ms=86400000
