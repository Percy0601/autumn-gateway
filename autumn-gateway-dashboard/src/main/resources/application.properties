spring.application.name=autumn-gateway
server.port=8080

# ===== 部署形态：可独立运行，也可挂在网关后面 =====
# 前端产物由 autumn-gateway-dashboard-vue 执行 npm run build 后直接编译进
# src/main/resources/static，随本服务一起发布（同源，无需跨域）。
#
# 网关路由两种方式（详见 GatewayCompatConfig）：
#   1) 网关 StripPrefix=1：转发时剥掉 /dashboard，本服务看到的仍是 /api/**，无需改动；
#   2) 网关不剥离前缀：打开下面这行，让本服务自带上下文路径。
# 独立部署时保持注释即可。
#server.servlet.context-path=/dashboard

# ===== 前端静态资源缓存 =====
# 前端每次构建都会生成新的带哈希文件名（index-xxxx.js），旧的会被删掉。
# 而 Spring Boot 默认对静态资源不下发 Cache-Control，浏览器按启发式规则缓存 index.html，
# 于是「后端/产物已更新，但浏览器仍拿旧 index.html 去请求已被删除的旧 chunk」——
# 表现为页面加载了却不显示最新内容（验证码不显示就是这种形态），且极难自查。
# 这里让静态资源每次都回源校验（命中 304 不重传），彻底消除「旧产物残留」。
spring.web.resources.cache.cachecontrol.no-cache=true

# ===== 数据源与表初始化按 profile 切换（mysql / postgresql）=====
# 默认使用 MySQL；切到 PostgreSQL 启动参数加 --spring.profiles.active=postgresql
spring.profiles.active=mysql
spring.sql.init.mode=always

# Hikari 连接池调优
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=5000

# Jackson 日期格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ===== RBAC 授权 =====
# enabled：总开关。false = 所有接口 permitAll（线上紧急回滚用，改配置即可，无需改代码）
basic.rbac.enabled=true
# url-check：是否叠加「数据驱动的 URL 资源鉴权」（规则存 basic_resource，未登记的接口一律 403）。
#   默认 false —— 因为需求要求「新增/编辑类操作认证即可」，而 URL 层是默认拒绝的，两者冲突。
#   细粒度管控统一由方法级 @PreAuthorize + 权限码完成；资源表维护完善后可置 true 做二次收口。
basic.rbac.url-check=false
# 权限缓存 TTL（秒）。授权变更后由 @GrantChanged 主动失效，这里只是兜底
basic.rbac.cache-ttl-seconds=60
# 用户组层级继承：上级用户组的角色是否向下继承
basic.rbac.group-inherit-enabled=true
# URL 资源鉴权匹配的 app_code（仅 url-check=true 时生效）
basic.rbac.app-code=dashboard

# JWT 配置
jwt.secret=autumn-gateway-secret-key-must-be-at-least-256-bits-long
jwt.expiration-ms=86400000

# ===== 登录安全 =====
# 验证码（防暴力破解）：关闭后登录页仍显示验证码，但服务端不再校验
# 注意：答案存服务端内存（无状态 JWT 架构不用 session），多节点水平扩容需换共享存储
autumn.captcha.enabled=true
autumn.captcha.length=4
autumn.captcha.ttl-seconds=180
# 连续登录失败次数上限：达到后自动禁用账号（status=0），需管理员在用户管理页重新启用（启用时清零计数）
autumn.user.max-login-error-count=5
