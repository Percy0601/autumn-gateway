spring.application.name=autumn-gateway
server.port=8080

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://192.168.1.16:3306/autumn-security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
#spring.datasource.username=admin
#spring.datasource.password=123456

# 数据源：H2 内存数据库（MySQL 兼容模式）
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:/autumn_gateway_dashboard;AUTO_SERVER=TRUE;AUTO_RECONNECT=TRUE;MODE=MYSQL
spring.datasource.username=sa
spring.datasource.password=123456

# H2 控制台（方便查看数据，开发时开启）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL 初始化（首次启动自动执行 schema.sql）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true  # 如果使用 JPA 需要，但你是 Spring Data JDBC，可以不配


# Hikari 调优（可选，但生产建议配）
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=5000



# Jackson 日期格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# JWT 配置
jwt.secret=autumn-gateway-secret-key-must-be-at-least-256-bits-long
jwt.expiration-ms=86400000
