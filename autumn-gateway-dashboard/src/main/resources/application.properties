spring.application.name=autumn-gateway
server.port=8080

# ===== 部署形态：可独立运行，也可挂在网关后面 =====
# 前端产物由 autumn-gateway-dashboard-vue 执行 npm run build 后直接编译进
# src/main/resources/static，随本服务一起发布（同源，无需跨域）。
#
# 网关路由两种方式（详见 GatewayCompatConfig）：
#   1) 网关 StripPrefix=1：转发时剥掉 /dashboard，本服务看到的仍是 /api/**，无需改动；
#   2) 网关不剥离前缀：打开下面这行，让本服务自带上下文路径。
# 独立部署时保持注释即可。
#server.servlet.context-path=/dashboard

# ===== 数据源与表初始化按 profile 切换（mysql / postgresql）=====
# 默认使用 MySQL；切到 PostgreSQL 启动参数加 --spring.profiles.active=postgresql
spring.profiles.active=mysql
spring.sql.init.mode=always

# Hikari 连接池调优
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=5000

# Jackson 日期格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# JWT 配置
jwt.secret=autumn-gateway-secret-key-must-be-at-least-256-bits-long
jwt.expiration-ms=86400000
