# db-mysql：MySQL 数据源（生产默认）
# 开启 ANSI_QUOTES：使 SQL 中的双引号被当作标识符引用（如 "user" 表），
# 从而让同一份 @Query 在 MySQL 与 PostgreSQL 下都能正确解析保留字 user。
#
# 连接串 / 账号 / 口令只从环境变量注入，无默认值：漏配即启动失败，
# 避免仓库内出现可用于连接生产库的凭据。参考仓库根目录 .env.example。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# 旧表结构 + basic_* 新表结构 + 网关 gw_* 表结构（均使用 CREATE TABLE IF NOT EXISTS，可重复执行）
spring.sql.init.schema-locations=classpath:schema-basic-mysql.sql,classpath:db/gateway/gw_schema_mysql.sql
# 种子数据（默认租户、admin 登录账号、basic_* 演示数据）由 NamespaceDataInitializer 统一幂等播种
