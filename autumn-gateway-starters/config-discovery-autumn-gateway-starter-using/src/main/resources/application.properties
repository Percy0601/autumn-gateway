spring.application.name=config-discovery-using
server.port=8080

# ===== 导入 Consul 配置（核心入口）=====
# 加 optional: 前缀 = Consul 拉取失败也继续启动；否则默认启动失败（fail-fast）
spring.config.import=consul:

# ===== Consul 连接与 KV 布局 =====
consul.config.host=localhost
consul.config.port=8500
# 连接/读取超时
consul.config.timeout=3s
# KV 根前缀（默认 config）
consul.config.prefix=config
# 应用名默认取 spring.application.name，也可显式指定：
# consul.config.application=config-discovery-using
# 启动拉取失败即失败（false = 跳过继续启动）
consul.config.fail-fast=true
# 动态刷新：Blocking Query 长轮询（默认开）
consul.config.watch-enabled=true
consul.config.watch-delay=15s

# ===== Consul KV 准备（local 手动示例）=====
# consul kv put config/application/demo.message hello-from-application
# consul kv put config/config-discovery-using/demo.message hello-from-app
# consul kv put config/config-discovery-using/demo.feature-enabled true
#
# 网关路由（改动即热更新）：
# consul kv put config/config-discovery-using/spring.cloud.gateway.server.webflux.routes[0].id demo-route
# consul kv put config/config-discovery-using/spring.cloud.gateway.server.webflux.routes[0].uri http://localhost:8081
# consul kv put config/config-discovery-using/spring.cloud.gateway.server.webflux.routes[0].predicates[0] "Path=/api/**"
# consul kv put config/config-discovery-using/spring.cloud.gateway.server.webflux.routes[0].filters[0] "StripPrefix=1"
