spring.application.name=limit-autumn-gateway-starter-using
server.port=8080

# ===== limit-autumn-gateway-starter 全局默认参数（路由过滤器未单独配置时生效）=====
limit.autumn-gateway.enabled=true
limit.autumn-gateway.replenish-rate=1
limit.autumn-gateway.burst-capacity=2
limit.autumn-gateway.time-window-seconds=10

# ===== 路由：/api/** 转发到 httpbin，经过 MemoryRateLimiter 限流 =====
# Gateway 5.x 配置前缀：spring.cloud.gateway.server.webflux.routes
spring.cloud.gateway.server.webflux.routes[0].id=rate-limit-demo
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/service-a/**

# 限流过滤器：name 与工厂类名去 GatewayFilterFactory 后缀一致
# key 默认取客户端真实 IP（X-Real-IP，由 CommonFilter 写入）
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=MemoryRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.replenish-rate=2
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.burst-capacity=4
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.time-window-seconds=10
# 等价短路写法：filters[0]=MemoryRateLimiter=2,4,10
spring.cloud.gateway.server.webflux.routes[0].filters[1]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[1].id=rate-limit-demo
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/service-b/**

# 限流过滤器：name 与工厂类名去 GatewayFilterFactory 后缀一致
# key 默认取客户端真实 IP（X-Real-IP，由 CommonFilter 写入）
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=MemoryRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.replenish-rate=3
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.burst-capacity=6
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.time-window-seconds=15
# 等价短路写法：filters[0]=MemoryRateLimiter=2,4,10
spring.cloud.gateway.server.webflux.routes[1].filters[1]=StripPrefix=2