spring.application.name=config-discovery-using
server.port=8080

# ==================== Gateway Discovery Locator ====================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.discovery.locator.predicates[0].name=Path
spring.cloud.gateway.discovery.locator.predicates[0].args[pattern]="'/'+serviceId.toLowerCase()+'/**'"
spring.cloud.gateway.discovery.locator.filters[0].name=StripPrefix
spring.cloud.gateway.discovery.locator.filters[0].args.parts=1

# ==================== Consul 配置（统一一份连接信息，config + discovery 共用） ====================

# 连接（唯一一份）
consul.host=localhost
consul.port=8500
consul.scheme=http
consul.timeout=3s
# consul.token=xxxxxx

# Config 专属：KV 布局 + 刷新
consul.config.enabled=true
consul.config.prefix=config
consul.config.fail-fast=true
consul.config.watch-enabled=true
consul.config.watch-delay=15s

# Discovery 专属：注册 + Watch
consul.discovery.enabled=true
consul.discovery.register=true
consul.discovery.deregister=true
# consul.discovery.service-name=config-discovery-using
# consul.discovery.instance-id=my-gateway-instance-01
# consul.discovery.hostname=192.168.1.100
consul.discovery.port-override=-1
consul.discovery.tags[0]=gateway
consul.discovery.tags[1]=v1
consul.discovery.metadata.env=dev
consul.discovery.metadata.version=0.0.1
consul.discovery.health-check-path=/health
consul.discovery.health-check-protocol=http
consul.discovery.health-check-interval=15s
consul.discovery.health-check-timeout=3s
consul.discovery.watch-enabled=true
consul.discovery.watch-delay=10s

# ==================== Spring Cloud 总开关 ====================
spring.cloud.discovery.enabled=true

