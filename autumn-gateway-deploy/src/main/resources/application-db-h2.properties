# ============================================================
# db-h2：本地内存库，零 DB 环境变量，用于「启动 / 路由 / 限流」冒烟
#   --spring.profiles.active=db-h2
#
# 注意：
#  1) 内存库是空的，没有 basic_user 等表，登录接口会失败。
#     完整登录闭环请用 db-mysql / db-postgresql 指向已初始化的 autumn-security 库。
#  2) 本 profile 不覆盖 JWT 密钥，AUTUMN_SHARED_JWT_SECRET 仍必须外部注入
#     （密钥不进仓库，任何 profile 都一样）。
#  3) 仅用于本地开发/冒烟，不要用于生产。
# ============================================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:autumn_security;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
