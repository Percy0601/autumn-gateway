spring.application.name=autumn-gateway
server.port=8080

# OAuth2 单点方式保留配方。
# 构建：mvn -Pcomponent-authn -Dno.authz ...
autumn.authz.enabled=false

# ============================================================
# 路由：浏览器只认网关（:8080），网关把请求转发给 dashboard（:8081）
# ============================================================
# dashboard 同时托管前端产物（/、/assets/**）与后端接口（/api/**），因此用通配路由。
# SPA 的 history 深链（/system/user 等）也会落到这里，由 dashboard 的 SpaFallbackConfig
# 回落到 index.html 交给前端路由渲染。
spring.cloud.gateway.server.webflux.routes[0].id=dashboard
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/**
# TokenRelay：把服务端会话里的 access_token 以 Authorization: Bearer 注入转发请求。
# 下游 dashboard 只需验签，不必知道用户是怎么登录的。
spring.cloud.gateway.server.webflux.routes[0].filters[0]=TokenRelay=

# ============================================================
# 统一认证（authn-autumn-gateway-starter）
# ============================================================
# 网关作为 OAuth2 客户端：未认证请求被送到授权服务器完成登录，
# 令牌留在网关的服务端会话里，浏览器只有一枚 HttpOnly 的 SESSION Cookie。
autumn.authn.enabled=true
autumn.authn.registration-id=web-client
autumn.authn.client-id=web-client
autumn.authn.client-secret=secret
autumn.authn.issuer-uri=http://localhost:9000
autumn.authn.scope=openid,profile
# 登录入口因此为：http://localhost:8080/oauth2/authorization/web-client
# 回调地址（必须已在授权服务器 oauth2_registered_client 表中登记）：
#   http://localhost:8080/login/oauth2/code/web-client
autumn.authn.redirect-uri-template={baseUrl}/login/oauth2/code/{registrationId}
autumn.authn.logout-url=/logout
# 登出后跳到授权服务器的登录页。
# 已知限制：这只清了网关侧会话，授权服务器会话仍在，再次访问网关会静默重新登录。
# 真正的单点登出（SLO）需要授权服务器提供 end_session_endpoint，属于 P3。
autumn.authn.logout-success-url=http://localhost:9000/login
autumn.authn.permit-all[0]=/actuator/health
autumn.authn.permit-all[1]=/actuator/health/**
autumn.authn.permit-all[2]=/favicon.ico
