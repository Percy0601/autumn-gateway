# ============================================================
# 官方 RequestRateLimiter + Bucket4jRateLimiter（单机内存）限流示例
#
# 用法二选一：
#   A) 把下面这些行复制进最终发行包的 application.properties（最稳妥）；
#   B) 启动时加 --spring.config.import=classpath:/feature/limit/application.properties
#
# 本片段只给主配置里的 routes[1]（dashboard-api /api/**）追加第 2 个 filter，
# 不覆盖 filters[0] 的 Authz；若你的路由下标不同，请同步调整 [1]。
#
# 默认关闭：主配置里 autumn.limit.enabled 未设置时，Bucket4jRateLimitConfig
# 不会注册任何 bean，RequestRateLimiter 也不会被使用，行为与改造前一致。
# ============================================================

# ---- 1) 打开限流 bean 装配 ----
autumn.limit.enabled=true
# 桶数量上限（每个 IP 一个桶），防止可控 key 空间撑爆内存
autumn.limit.cache-maximum-size=10000
# 桶空闲多久回收
autumn.limit.cache-expiration=1m
# 可信的客户端 IP 头。留空 = 只信 TCP 远端地址。
# 只有前面挂了「会剥离客户端自带同名头」的可信反向代理时才填 X-Forwarded-For，
# 否则攻击者换个头就是一个新桶，限流直接失效。
autumn.limit.trusted-header=

# ---- 2) 给 dashboard-api 路由追加 RequestRateLimiter ----
# 注意：name=RequestRateLimiter 是固定的过滤器名；具体用 Redis 还是内存 Bucket4j，
# 由上面的 bean 决定，不是在这里写实现类名。
spring.cloud.gateway.server.webflux.routes[1].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.key-resolver=#{@ipKeyResolver}
# 桶容量：突发上限
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.bucket4j-rate-limiter.capacity=4
# 每个补充周期回灌多少 token
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.bucket4j-rate-limiter.refill-tokens=2
# 补充周期（10 秒回灌 2 个）
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.bucket4j-rate-limiter.refill-period=10s
# 每次请求消耗几个 token
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.bucket4j-rate-limiter.requested-tokens=1

# ============================================================
# 效果：同一 IP 连续快速请求 /api/**，前 4 次放行，之后返回 429 Too Many Requests，
# 响应头带 X-RateLimit-Remaining / X-RateLimit-Replenish-Rate 等。
# 10 秒后回灌 2 个 token，可再放行 2 次。
#
# 已知边界：
#  1) 内存桶是单机的，多实例部署时每个实例各算各的；集群请换 Redis 或集中配额。
#  2) /gateway/endpoint/login 与 /endpoint/captcha 是网关本地 Controller，
#     不走 Gateway 路由过滤器链，因此本示例限不到它们。要给登录接口防暴破，
#     需要额外的 WebFilter（不能靠 route filter），本示例未包含。
#  3) GraalVM native 下 Caffeine 会反射加载生成的缓存实现类，
#     已随本模块提供 META-INF/native-image/.../reflect-config.json。
# ============================================================
