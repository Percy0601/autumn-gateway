# ============================================================
# db-mysql：默认运行时 profile（等价于改造前的 MySQL 发行形态）
#
# 三个值均从环境变量注入，无默认值：漏配即启动失败，避免仓库内出现可用凭据。
# DB_URL 需要完整 JDBC URL，例如：
#   jdbc:mysql://<host>:3306/autumn-security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
# 参考仓库根目录 .env.example。
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
