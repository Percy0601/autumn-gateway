spring.application.name=autumn-gateway
server.port=8080

# ============================================================
# 运行时形态：数据库用 Spring profile 切换，同一个二进制无需重新构建
#   db-mysql       默认，等价于改造前的 MySQL 发行形态（需注入 DB_* / JWT 环境变量）
#   db-postgresql  PostgreSQL
#   db-h2          本地内存库，零环境变量，用于启动/路由/限流冒烟
# 切换方式：--spring.profiles.active=db-h2 或环境变量 SPRING_PROFILES_ACTIVE=db-h2
# 注意：这是 Spring profile，与 pom 里的 Maven profile（component-* / os-*）不是一回事。
# ============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:db-mysql}

# ============================================================
# 默认发行形态：轻量 JWT 认证 + 路由级鉴权
# authz-autumn-gateway-starter 只提供路由 FilterFactory，不注册 GlobalFilter：
#   不挂 Authz                   = 匿名访问
#   Authz=authenticate,<appCode> = 只验证 Bearer JWT
#   Authz=authorize,<appCode>    = 验 JWT + 查询角色/资源 + Ant 路径鉴权
# OAuth2 单点方式的完整配方保留在 feature/oauth2/application.properties。
# ============================================================
autumn.authn.enabled=false
autumn.authz.enabled=true

# dashboard 登录相关匿名端点：验证码 <img src="/api/captcha"> 是浏览器裸请求、不带 Bearer 头，
# 必须先于 Authz 路由放行；/api/login/account、/api/login/outLogin 与 dashboard SecurityConfig
# 的匿名放行清单保持一致（登录页整套协议都允许匿名加载）。
spring.cloud.gateway.server.webflux.routes[0].id=dashboard-login-anon
spring.cloud.gateway.server.webflux.routes[0].order=-200
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/captcha,/api/login/account,/api/login/outLogin

# dashboard API 只需要认证；dashboard 自己继续负责方法级 RBAC。
# 若某个服务需要网关同时鉴权，把 authenticate 改成 authorize，并设置该服务的 app-code。
spring.cloud.gateway.server.webflux.routes[1].id=dashboard-api
spring.cloud.gateway.server.webflux.routes[1].order=-100
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=Authz=authenticate,dashboard

# 登录页、验证码页面资源和 SPA history 深链不挂 Authz，允许匿名加载。
# /gateway/endpoint/login 与 /gateway/endpoint/captcha 是网关本地 Controller，不走下游 route。
spring.cloud.gateway.server.webflux.routes[2].id=dashboard-ui
spring.cloud.gateway.server.webflux.routes[2].order=100
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/**

# ===== 登录数据源 =====
# 驱动/连接串/账号口令全部由 application-db-*.properties 按 profile 提供。
# 这里刻意不写 spring.datasource.*：密钥与内网地址不进仓库，缺失环境变量时快速失败。
# 参考 .env.example 与 src/main/resources/README.md。

# ===== JWT：Nimbus + HS256 =====
# gateway 签发与 dashboard 验签必须使用同一值。
# 没有默认值：漏配 AUTUMN_SHARED_JWT_SECRET 直接启动失败，避免回落到公开开发密钥。
autumn.authz.jwt.secret=${AUTUMN_SHARED_JWT_SECRET}
autumn.authz.jwt.issuer=autumn-gateway
autumn.authz.jwt.ttl-seconds=86400

# ===== 登录安全 =====
autumn.authz.max-login-attempts=5
autumn.authz.login-app-code=dashboard
autumn.authz.captcha.enabled=true
autumn.authz.captcha.length=4
autumn.authz.captcha.ttl-seconds=180
autumn.authz.captcha.cookie-name=captchaId

# ===== 可配置 PreparedStatement 查询 =====
# 覆盖 SQL 时必须保留固定列别名与参数顺序，详见 AuthzGatewayProperties.Sql。
autumn.authz.sql.user-query=SELECT u.id AS user_id, u.uuid AS subject, u.username AS username, u.password AS password_hash, u.status AS status, u.login_error_count AS login_error_count, u.admin AS admin FROM basic_user u WHERE u.username = ?
autumn.authz.sql.roles-query=SELECT DISTINCT r.id AS role_id, r.code AS role_code, r.master AS role_master FROM basic_user_role ur JOIN basic_role r ON r.id = ur.role_id WHERE ur.user_id = ? AND ur.del_flag = 0 AND r.del_flag = 0 AND r.status = 1 AND ur.app_id IN (SELECT a.id FROM basic_app a WHERE a.app_code = ?)
autumn.authz.sql.resource-query=SELECT DISTINCT r.path AS resource_path, r.http_method AS http_method, r.match_type AS match_type FROM basic_resource r WHERE r.status = 1 AND r.app_code = ? AND (r.id IN (SELECT p.ref_id FROM basic_role_permission p WHERE p.role_id = ? AND p.type = 2 AND p.del_flag = 0) OR r.id IN (SELECT mr.resource_id FROM basic_menu_resource mr JOIN basic_role_permission p2 ON p2.ref_id = mr.menu_id WHERE p2.role_id = ? AND p2.type = 1 AND p2.del_flag = 0 AND mr.deleted = 0))
autumn.authz.sql.login-failure-sql=UPDATE basic_user SET login_error_count = ?, status = ?, update_time = CURRENT_TIMESTAMP WHERE id = ?
autumn.authz.sql.login-success-sql=UPDATE basic_user SET login_error_count = ?, last_login_at = CURRENT_TIMESTAMP WHERE id = ?

# ============================================================
# 限流（官方 RequestRateLimiter + Bucket4jRateLimiter，单机内存 / Caffeine 后端）
# 默认关闭，不影响现有发行形态。完整可复制的示例见 feature/limit/。
#
# 澄清：RequestRateLimiter 的默认实现是 RedisRateLimiter（需要 Redis）；
# 只有当 classpath 存在 bucket4j 且注册了 AsyncProxyManager<String> bean 时，
# Gateway 才会自动装配内存版 Bucket4jRateLimiter。本模块因此带 bucket4j 依赖，
# 但 bean 由 autumn.limit.enabled=true 条件装配，默认不注册。
#
# 启用步骤：① 打开下面 autumn.limit.enabled；② 给目标路由加 RequestRateLimiter filter。
# 例：给登录接口（本地 Controller，需单开一条 route）按 IP 限流，见 feature/limit/application.properties。
# ============================================================
# autumn.limit.enabled=true
# autumn.limit.capacity=4
# autumn.limit.refill-tokens=2
# autumn.limit.refill-period=10s
# autumn.limit.cache-maximum-size=10000
# autumn.limit.cache-expiration=1m
# autumn.limit.trusted-header=

# ============================================================
# 注册发现 / 配置中心 / 泳道路由：autumn-cloud-extension
#   依赖坐标 xyz.we-win.autumn:*:1.0.0-RELEASE，能力由 Maven profile 决定装不装：
#     -Pcomponent-discovery(-nacos|-multicast) 服务发现（三选一）
#     -Pcomponent-config(-nacos)               配置中心（可选，二选一）
#     -Pcomponent-traffic                      泳道路由（可选，需配合服务发现）
#   下面这些键在未装配对应 Starter 时只是惰性属性，不产生任何效果。
# ============================================================

# ----- 服务发现（前缀 autumn.discovery）-----
# 网关只做发现者、不注册自己。
autumn.discovery.register=false
# 只引一个 discovery starter 时可省略 backend（自动激活）；
# 同时引多个后端时必须显式指定，否则启动期 BackendValidator 直接失败。
# autumn.discovery.backend=consul
autumn.discovery.consul.host=${AUTUMN_CONSUL_HOST:127.0.0.1}
autumn.discovery.consul.port=${AUTUMN_CONSUL_PORT:8500}
autumn.discovery.consul.scheme=http
# autumn.discovery.consul.namespace=
# autumn.discovery.consul.token=
# autumn.discovery.consul.health-check-ttl-seconds=30
# Nacos 后端（-Pcomponent-discovery-nacos 时使用）
# autumn.discovery.backend=nacos
# autumn.discovery.nacos.server-addr=${AUTUMN_NACOS_HOST:127.0.0.1}:${AUTUMN_NACOS_PORT:8848}

# ----- 配置中心（前缀 autumn.config，可选）-----
# 必须显式设置 backend 才启用；不设置只输出 WARN，不会静默装配。
# autumn.config.enabled=true
# autumn.config.backend=consul
# autumn.config.data-id=${spring.application.name}.properties
# autumn.config.group=
# autumn.config.default-group=DEFAULT_GROUP
# autumn.config.refresh-enabled=true
# autumn.config.consul.host=${AUTUMN_CONSUL_HOST:127.0.0.1}
# autumn.config.consul.port=${AUTUMN_CONSUL_PORT:8500}
# autumn.config.consul.token=
# autumn.config.consul.datacenter=dc1

# ----- 泳道路由（前缀 autumn.traffic，可选）-----
# 按请求头里的泳道标签挑同标签实例；未打标/未带头归入 default 主干。
# 只有 lb:// 路由才会走到这段逻辑，普通 uri=http:// 直连路由不受影响。
autumn.traffic.header=X-Traffic
autumn.traffic.fallback-to-main=true

# ----- Thrift 泛化路由（前缀 autumn.thrift，可选，需要 -Pcomponent-thrift）-----
# 方向是单向的：HTTP 请求（JSON 参数）→ 泛化转换成 Thrift 调用 → JSON 响应。
# 网关按 IDL 在运行期编解码，不生成任何 stub，后端仍是普通 Thrift 服务。
# 默认关闭：引入依赖但不开这个开关时，ThriftGeneric 路由直接返回 503，
# 既有 HTTP 路由、装配顺序、启动耗时都不受影响。
autumn.thrift.enabled=false
autumn.thrift.connect-timeout-millis=2000
autumn.thrift.socket-timeout-millis=5000
# 在飞调用上限：thrift 是阻塞 IO，超出直接 503，避免拖垮 HTTP 转发
autumn.thrift.max-concurrent-calls=256
# 与后端 TServer 的 transportFactory 保持一致（后端用 TFramedTransport 就保持 true）
autumn.thrift.framed=true
# 后端用 TMultiplexedProcessor 时打开
autumn.thrift.multiplexed=false
# 是否把后端异常原文透给调用方；默认 false，只回 errorType
autumn.thrift.expose-error-detail=false
# 默认已内置 X-Traffic → traffic（与 autumn-cloud-extension 泳道头、protocol-extension 隐式参数同名），
# 需要额外透传时照下面这行加：
# autumn.thrift.attachment-header-mapping.X-Request-Id=requestId

# 服务登记示例：P0 是静态端点，P1 会改成从注册中心解析实例。
# autumn.thrift.services[0].name=demoService
# autumn.thrift.services[0].host=127.0.0.1
# autumn.thrift.services[0].port=9090
# autumn.thrift.services[0].idl-location=classpath:idl/demo.thrift
# 内联 IDL 也行（properties 里的换行要写成 \n）：
# autumn.thrift.services[0].idl=service demoService { string sayHello(1: string name) }
