# db-h2：H2 数据源（本地开发；激活方式：--spring.profiles.active=db-h2）
# 与 dashboard 的 db-h2 profile 连同一个 H2 TCP 服务（localhost:9092/autumn_security）
# 启动前确保 D:\opt\h2\start-h2-server.bat 已运行
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=${DB_URL:jdbc:h2:tcp://localhost:9092/autumn_security;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${DB_USER:sa}
# 本地 H2 TCP 服务的开发口令，仅用于本机联调，不用于生产；
# 可用 DB_PASSWORD 环境变量覆盖，生产请用 db-mysql profile + 环境变量注入。
spring.datasource.password=${DB_PASSWORD:123456}
