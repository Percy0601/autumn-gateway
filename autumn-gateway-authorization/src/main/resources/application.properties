server.port=9000
spring.application.name=authorization-server
spring.main.allow-bean-definition-overriding=true

# ============================================================
# 数据源：与 dashboard 使用同一个库（autumn-security）
# 账号体系（user + user_auth_account + user_role）与 dashboard 完全一致
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.1.16:3306/autumn-security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=admin
spring.datasource.password=123456

# 本地开发可切换 H2（MySQL 兼容模式），与 dashboard 的备用配置保持一致
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.url=jdbc:h2:file:./autumn_gateway_dashboard;AUTO_SERVER=TRUE;AUTO_RECONNECT=TRUE;MODE=MYSQL
#spring.datasource.username=sa
#spring.datasource.password=123456

# 启动时自动建表（脚本均为 CREATE TABLE IF NOT EXISTS，可重复执行）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-oauth2.sql

# ============================================================
# 授权服务器配置
# ============================================================
# 签发者地址：本地直连可不配（按请求自动推导）；经网关/反代后必须配置
#autumn.authorization-server.issuer=http://localhost:9000

# 令牌中的角色范围：只取指定应用下的角色，留空表示取全部应用角色
#autumn.authorization-server.role-app-id=

# 演示客户端初始化（web-client / secret），生产环境务必改为 false
autumn.authorization-server.demo-client.enabled=true
