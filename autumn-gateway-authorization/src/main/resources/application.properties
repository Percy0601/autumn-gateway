server.port=9000
spring.application.name=authorization-server
spring.main.allow-bean-definition-overriding=true

# ============================================================
# 数据源与表初始化按 profile 切换（db-mysql / db-h2）
# 与 dashboard 使用同一个库（autumn-security）
# 账号体系（user + user_auth_account + user_role）与 dashboard 完全一致
#
# 默认 db-mysql；连接信息从环境变量注入（参考仓库根目录 .env.example：
# DB_URL / DB_USER / DB_PASSWORD），无默认值，漏配即启动失败。
# 旧名 h2database / mysql 仍可使用：下方 profile group 自动映射。
#
# 注意：不提供 db-postgresql —— 本服务的建表脚本（schema-oauth2.sql /
# schema-login-security.sql）为 MySQL 方言（列级 COMMENT 等），PG 需要
# 先做脚本适配，配一个起不来的 profile 没有意义。
# ============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:db-mysql}
spring.profiles.group.mysql=db-mysql
spring.profiles.group.h2database=db-h2

# 启动时自动建表（脚本均为 CREATE TABLE IF NOT EXISTS，可重复执行）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-oauth2.sql,classpath:schema-login-security.sql

# ============================================================
# 授权服务器配置
# ============================================================
# 签发者地址：浏览器直连本服务，显式配置可保证 token 的 iss 稳定（不随 Host 头漂移）
autumn.authorization-server.issuer=http://localhost:9000

# 令牌中的角色范围：只取指定应用下的角色，留空表示取全部应用角色
#autumn.authorization-server.role-app-id=

# 演示客户端默认关闭（原为 true + 公开弱密钥 secret）。
# 本地联调要启用时，必须同时提供两个环境变量，缺一即启动失败：
#   DEMO_CLIENT_ENABLED=true
#   AUTHN_CLIENT_SECRET=<随机密钥>
autumn.authorization-server.demo-client.enabled=${DEMO_CLIENT_ENABLED:false}
autumn.authorization-server.demo-client.client-secret=${AUTHN_CLIENT_SECRET:}
# 网关作为 OAuth2 客户端时的回调地址（Spring Security 的约定路径：/login/oauth2/code/{registrationId}）
autumn.authorization-server.demo-client.redirect-uri=http://localhost:8080/login/oauth2/code/web-client,http://127.0.0.1:8080/callback

# ============================================================
# JWT 签名密钥（JWKS）
# ============================================================
# database（默认）：密钥持久化到 oauth2_jwk 表，重启/多实例共用同一把密钥
# file           ：持久化到文件，见 autumn.authorization-server.jwk.file-path
# memory         ：每次启动随机生成（原始实现，仅演示，重启后已签发令牌失效）
autumn.authorization-server.jwk.store-type=database
autumn.authorization-server.jwk.key-id=autumn-gateway-authorization-key
#autumn.authorization-server.jwk.file-path=./config/authorization-jwk.json

# ============================================================
# 登录安全
# ============================================================
# 验证码（SVG，零依赖）。本地联调/自动化压测可临时关闭
autumn.security.captcha.enabled=true
autumn.security.captcha.length=4
autumn.security.captcha.ttl-seconds=180

# 连续密码错误 10 次锁定 30 分钟（主流 ERP / 后台系统的通行做法）
autumn.security.login.max-attempts=10
autumn.security.login.lock-minutes=30

# ============================================================
# 微信登录（微信开放平台 - 网站应用扫码登录）
# 未配置 appid/secret 前保持 enabled=false；配置后改为 true 并在开放平台登记回调地址
# ============================================================
autumn.wechat.enabled=true
#autumn.wechat.app-id=你的微信开放平台网站应用appid
#autumn.wechat.app-secret=你的微信开放平台网站应用appsecret
autumn.wechat.redirect-uri=http://localhost:9000/login/wechat/callback
# 网站应用扫码登录用 snsapi_login；公众号网页授权用 snsapi_userinfo
autumn.wechat.scope=snsapi_login
# 首次微信登录自动创建本地账号；false 时要求先在后台绑定
autumn.wechat.auto-create-user=true
