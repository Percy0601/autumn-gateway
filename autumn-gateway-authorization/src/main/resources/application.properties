server.port=9000
spring.application.name=authorization-server
spring.main.allow-bean-definition-overriding=true

# ============================================================
# 数据源：与 dashboard 使用同一个库（autumn-security）
# 账号体系（user + user_auth_account + user_role）与 dashboard 完全一致
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.1.16:3306/autumn-security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=admin
spring.datasource.password=123456

# 本地开发可切换 H2（MySQL 兼容模式），与 dashboard 的备用配置保持一致
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.url=jdbc:h2:file:./autumn_gateway_dashboard;AUTO_SERVER=TRUE;AUTO_RECONNECT=TRUE;MODE=MYSQL
#spring.datasource.username=sa
#spring.datasource.password=123456

# 启动时自动建表（脚本均为 CREATE TABLE IF NOT EXISTS，可重复执行）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-oauth2.sql,classpath:schema-login-security.sql

# ============================================================
# 授权服务器配置
# ============================================================
# 签发者地址：本地直连可不配（按请求自动推导）；经网关/反代后必须配置
#autumn.authorization-server.issuer=http://localhost:9000

# 令牌中的角色范围：只取指定应用下的角色，留空表示取全部应用角色
#autumn.authorization-server.role-app-id=

# 演示客户端初始化（web-client / secret），生产环境务必改为 false
autumn.authorization-server.demo-client.enabled=true

# ============================================================
# JWT 签名密钥（JWKS）
# ============================================================
# database（默认）：密钥持久化到 oauth2_jwk 表，重启/多实例共用同一把密钥
# file           ：持久化到文件，见 autumn.authorization-server.jwk.file-path
# memory         ：每次启动随机生成（原始实现，仅演示，重启后已签发令牌失效）
autumn.authorization-server.jwk.store-type=database
autumn.authorization-server.jwk.key-id=autumn-gateway-authorization-key
#autumn.authorization-server.jwk.file-path=./config/authorization-jwk.json

# ============================================================
# 登录安全
# ============================================================
# 验证码（SVG，零依赖）。本地联调/自动化压测可临时关闭
autumn.security.captcha.enabled=true
autumn.security.captcha.length=4
autumn.security.captcha.ttl-seconds=180

# 连续密码错误 10 次锁定 30 分钟（主流 ERP / 后台系统的通行做法）
autumn.security.login.max-attempts=10
autumn.security.login.lock-minutes=30
