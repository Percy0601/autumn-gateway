# H2 数据源（激活方式：--spring.profiles.active=h2database）
# 与 dashboard 的 h2database profile 连同一个 H2 TCP 服务（localhost:9092/autumn_security）
# 启动前确保 D:\opt\h2\start-h2-server.bat 已运行
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:tcp://localhost:9092/autumn_security;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=123456

# 授权服务器自己的建表脚本（OAuth2 四表 + 登录安全表）
# basic_* 表由 dashboard 的 h2database profile 建，两者同库不冲突
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-oauth2.sql,classpath:schema-login-security.sql
