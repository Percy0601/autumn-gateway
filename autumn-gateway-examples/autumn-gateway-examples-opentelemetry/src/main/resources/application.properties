spring.application.name=autumn-gateway-examples-opentelemetry
server.port=8080

# SB4 OTel 配置（注意前缀 management.opentelemetry，不是 otel.*）
management.opentelemetry.resource-attributes.service.name=examples-opentelemetry
management.opentelemetry.resource-attributes.deployment.environment=dev
management.opentelemetry.tracing.sampling.probability=1.0

# OTLP exporter 端点（SB4 也认 otel.exporter.otlp 前缀）
otel.exporter.otlp.endpoint=http://192.168.1.16:4318
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.compression=gzip

# 传播器：兼容 tracecontext 和 b3（如果下游还有 Sleuth 老系统）
otel.propagators=tracecontext,b3

# 暴露 actuator 端点（可选）
management.endpoints.web.exposure.include=health,metrics,info

# 路由ID
spring.cloud.gateway.server.webflux.routes[0].id=service-a
# 目标URI
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-a
# Predicates（断言）
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**
# Filters（过滤器）
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
management.metrics.export.otlp.enabled=false