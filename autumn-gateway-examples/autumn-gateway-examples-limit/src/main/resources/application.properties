spring.application.name=autumn-gateway-examples-limit
server.port=8080

# Gateway 5.x 路由配置前缀：spring.cloud.gateway.server.webflux.routes
spring.cloud.gateway.server.webflux.routes[0].id=local-limit-demo
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**

# 官方内置限流：RequestRateLimiter + Bucket4jRateLimiter（单机内存，Caffeine 后端）
# 只需在 Bucket4jConfig 里提供 AsyncProxyManager<String> bean，Gateway 自动装配 Bucket4jRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}
# bucket4j-rate-limiter.* 是 Bucket4jRateLimiter 的 kebab-case 参数（capacity / refill-period 必填）
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.bucket4j-rate-limiter.capacity=4
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.bucket4j-rate-limiter.refill-tokens=2
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.bucket4j-rate-limiter.refill-period=10s
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.bucket4j-rate-limiter.requested-tokens=1
spring.cloud.gateway.server.webflux.routes[0].filters[1]=StripPrefix=1
