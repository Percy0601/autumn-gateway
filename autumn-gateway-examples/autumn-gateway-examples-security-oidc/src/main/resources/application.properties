spring.application.name=autumn-gateway-examples-oidc
server.port=8080
config.jwt.secret=test
config.jwt.expire=3
config.jwt.header=testProject

# ==================== GitHub (OAuth2) ====================
# 如何获取 client-id / client-secret:
# 1. 打开 https://github.com/settings/developers
# 2. 点击 "OAuth Apps" -> "New OAuth App"
# 3. Application name: 随便填，如 "autumn-gateway-test"
# 4. Homepage URL: http://localhost:8080
# 5. Authorization callback URL: http://localhost:8080/login/oauth2/code/github
# 6. 创建后复制 Client ID 和 Client Secret 填入下面
spring.security.oauth2.client.registration.github.client-id=你的github-client-id
spring.security.oauth2.client.registration.github.client-secret=你的github-client-secret
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ==================== Google (OIDC) ====================
# 如何获取 client-id / client-secret:
# 1. 打开 https://console.cloud.google.com/apis/credentials
# 2. 创建项目 -> 创建 OAuth 2.0 客户端 ID
# 3. 应用类型选 "Web 应用"
# 4. 已授权的重定向 URI: http://localhost:8080/login/oauth2/code/google
# 5. 创建后复制 Client ID 和 Client Secret 填入下面
spring.security.oauth2.client.registration.google.client-id=你的google-client-id
spring.security.oauth2.client.registration.google.client-secret=你的google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ==================== 微信 (WeChat OAuth2) ====================
# ⚠️ 微信不支持标准 OIDC，需要自定义以下组件：
#   - WeChatOAuth2AccessTokenResponseClient: 微信 token 接口使用 GET + query 参数（非标准 POST）
#   - WeChatReactiveOAuth2UserService: 微信 userinfo 接口需要 access_token + openid 作为 query 参数
#   - WeChatReactiveAuthenticationManager: 路由微信请求到自定义流程
#
# 如何获取 appid / secret:
# 1. 打开 https://open.weixin.qq.com (微信开放平台)
# 2. 注册开发者账号 -> 创建"网站应用"
# 3. 应用官网: http://localhost:8080
# 4. 授权回调域: localhost (注意：回调域不带协议和端口)
# 5. 审核通过后，获取 AppID 和 AppSecret 填入下面
# ⚠️ 微信开放平台的"网站应用"需要企业资质才能创建
# 💡 个人开发者可以使用"微信测试号"进行开发调试:
#    https://mp.weixin.qq.com/debug/cgi-bin/sandbox?t=sandbox/login
spring.security.oauth2.client.registration.wechat.client-id=你的微信appid
spring.security.oauth2.client.registration.wechat.client-secret=你的微信appsecret
spring.security.oauth2.client.registration.wechat.scope=snsapi_login,snsapi_userinfo
spring.security.oauth2.client.registration.wechat.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.wechat.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.wechat.client-name=微信登录

# 微信 Provider 端点配置（非标准，仅用于 Spring Security 构建 AuthorizationRequest）
# 实际的 token 交换和 userinfo 获取由自定义组件完成
spring.security.oauth2.client.provider.wechat.authorization-uri=https://open.weixin.qq.com/connect/qrconnect
spring.security.oauth2.client.provider.wechat.token-uri=https://api.weixin.qq.com/sns/oauth2/access_token
spring.security.oauth2.client.provider.wechat.user-info-uri=https://api.weixin.qq.com/sns/userinfo
spring.security.oauth2.client.provider.wechat.user-name-attribute=openid

# ==================== Gateway 路由 ====================
# 路由ID
spring.cloud.gateway.server.webflux.routes[0].id=user-route
# 目标URI
spring.cloud.gateway.server.webflux.routes[0].uri=http://127.0.0.1:8081
# Predicates（断言）
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**
# Filters（过滤器）
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
