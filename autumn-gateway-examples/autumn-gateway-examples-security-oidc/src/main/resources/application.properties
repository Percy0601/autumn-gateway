spring.application.name=autumn-gateway-examples-oidc
server.port=8080
config.jwt.secret=test
config.jwt.expire=3
config.jwt.header=testProject

# ========== 微信开放平台 OAuth2 配置 ==========
# 在微信开放平台创建网站应用后获取
wechat.oauth2.app-id=your_wechat_appid
wechat.oauth2.app-secret=your_wechat_appsecret
# 微信授权回调地址（需与微信开放平台配置一致）
wechat.oauth2.redirect-uri=http://localhost:8080/auth/wechat/callback

# 路由ID
spring.cloud.gateway.server.webflux.routes[0].id=user-route
# 目标URI
spring.cloud.gateway.server.webflux.routes[0].uri=http://127.0.0.1:8081
# Predicates（断言）
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**
# Filters（过滤器）
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1