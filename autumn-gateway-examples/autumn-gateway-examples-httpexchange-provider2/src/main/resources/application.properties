spring.application.name=httpexchage-provider
server.port=8086

# ==================== 自定义服务发现（autumn-gateway-discovery） ====================
# 与 httpexchange-provider(8083) 注册同一个服务名，构成多实例集群，供 LoadBalancer 轮询
spring.cloud.autumn-registry.enabled=true
spring.cloud.autumn-registry.discovery.enabled=true
# 自定义注册中心地址（AutumnRegistryClient 指向）
spring.cloud.my-registry.server=http://localhost:9999

# ==================== LoadBalancer ====================
spring.cloud.loadbalancer.enabled=true

# 静态实例兜底：注册中心当前是教学伪代码（findInstances 返回空列表），
# 当 DiscoveryClient 查不到实例时，LoadBalancer 回退到这里的静态实例列表，
# 从而可以演示 RoundRobin 在 httpexchange-provider(8083) 与自身(8085) 之间轮询。
spring.cloud.autumn-registry.static-instances.httpexchage-provider[0]=127.0.0.1:8083
spring.cloud.autumn-registry.static-instances.httpexchage-provider[1]=127.0.0.1:8085
