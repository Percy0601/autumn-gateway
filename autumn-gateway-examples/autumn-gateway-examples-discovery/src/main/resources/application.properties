spring.application.name=autumn-gateway-examples-basic
server.port=8080
# 路由ID
spring.cloud.gateway.server.webflux.routes[0].id=user-route
# 目标URI
spring.cloud.gateway.server.webflux.routes[0].uri=http://127.0.0.1:8081
# Predicates（断言）
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**
# Filters（过滤器）
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# ==================== LoadBalancer + 服务发现（lb:// 路由） ====================
# lb:// 路由：目标实例由 LoadBalancer 通过 DiscoveryClient（AutumnDiscoveryClient）获取，
# 再经 AutumnServiceInstanceListSupplier 过滤（模拟 Consul 风格的健康/权重过滤）。
# 当前注册中心为伪代码实现（返回空实例列表），接入真实注册中心后放开下面配置即可生效：
# spring.cloud.gateway.server.webflux.routes[1].id=discovery-lb-route
# spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
# spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/lb/**